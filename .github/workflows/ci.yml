name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces a run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, check coverage, cross-compile, release build
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commits; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the release build reads tags

      # Installs the exact tool versions pinned in .mise.toml.
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1

      - name: Verify go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Lint
        run: mise run lint

      - name: Test
        run: mise run test

      - name: Every check is made to fire by a test
        run: mise run checkcover

      - name: Cross-compile
        run: mise run cross

      - name: Release build (not published)
        run: mise run release-check
