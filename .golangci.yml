version: "2"

linters:
  default: standard            # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose                # HTTP response bodies are closed
    - errorlint                # errors are wrapped and compared correctly
    - gosec                    # security checks
    - misspell
    - noctx                    # HTTP requests carry a context
    - unconvert
    - usestdlibvars
  settings:
    misspell:
      locale: UK               # Australian English follows UK spelling
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests read fixture files by computed paths.
      - path: _test\.go
        linters: [gosec]
        text: "G304"

formatters:
  enable:
    - gofmt
    - goimports
