workflows:
  - name: JSCTEST2 Classic Jira
    mode: reuse
    description: The default Jira workflow.
    id: 0cfdac10-d186-4e2d-ad75-ea4140279570
    statuses:
      - name: Open
        layout: {x: 1328, y: 165}
      - name: In Progress
        layout: {x: 1305.07373046875, y: 610}
      - name: Resolved
        layout: {x: 1714.5, y: 165}
      - name: Reopened
        layout: {x: 1713.75, y: 421}
      - name: Closed
        layout: {x: 1522, y: 315}
        properties: {jira.issue.editable: "false"}
    transitions:
      - name: Create Issue
        type: initial
        to: Open
        validators:
          - type: permission
            permission: CREATE_ISSUES
        properties: {jira.i18n.title: common.forms.create, opsbar-sequence: "0"}
        id: "1"
      - name: Stop Progress
        from: [In Progress]
        to: Open
        event: Work Stopped On Issue
        conditions:
          all:
            - type: restrict_to
              permissions: [ASSIGNABLE_USER]
        validators:
          - type: fields_required
            fields: [Assignee]
            error_message: Assignee must be set(!)
        post_functions:
          - type: clear_field
            field: Resolution
        properties: {jira.i18n.title: stopprogress.title, opsbar-sequence: "20"}
        id: "301"
      - name: Self-loop
        from: [Resolved]
        to: Resolved
        id: "6"
      - name: Close Issue
        from: [Resolved]
        to: Closed
        description: Closing an issue indicates there is no more work to be done on it, and it has been verified as complete.
        screen: Workflow Screen
        event: Issue Closed
        conditions:
          all:
            - type: restrict_to
              permissions: [CLOSE_ISSUES]
        properties: {jira.i18n.submit: closeissue.close, jira.i18n.title: closeissue.title, opsbar-sequence: "60"}
        id: "701"
      - name: Close Issue
        from: [Open, In Progress, Reopened]
        to: Closed
        screen: Resolve Issue Screen
        event: Issue Closed
        conditions:
          all:
            - type: restrict_to
              permissions: [RESOLVE_ISSUES]
            - type: restrict_to
              permissions: [CLOSE_ISSUES]
        properties: {jira.i18n.submit: closeissue.close, jira.i18n.title: closeissue.title, opsbar-sequence: "60"}
        id: "2"
      - name: Reopen Issue
        from: [Resolved, Closed]
        to: Reopened
        screen: Workflow Screen
        event: Issue Reopened
        conditions:
          all:
            - type: restrict_to
              permissions: [RESOLVE_ISSUES]
        post_functions:
          - type: clear_field
            field: Resolution
        properties:
          jira.i18n.submit: issue.operations.reopen.issue
          jira.i18n.title: issue.operations.reopen.issue
          opsbar-sequence: "80"
        id: "3"
      - name: Start Progress
        from: [Open, Reopened]
        to: In Progress
        screen: Default Screen
        event: Work Started On Issue
        conditions:
          all:
            - type: restrict_to
              groups: [jira-admins-example]
        post_functions:
          - type: clear_field
            field: Resolution
          - type: assign
            to: current_user
        properties: {jira.i18n.title: startprogress.title, opsbar-sequence: "20"}
        id: "4"
      - name: Resolve Issue
        from: [Open, In Progress, Reopened]
        to: Resolved
        screen: Resolve Issue Screen
        event: Issue Resolved
        conditions:
          all:
            - type: restrict_to
              permissions: [RESOLVE_ISSUES]
        post_functions:
          - type: set_field
            field: Actual end
            value: '%%CURRENT_DATETIME%%'
            mode: replace
        properties: {jira.i18n.submit: resolveissue.resolve, jira.i18n.title: resolveissue.title, opsbar-sequence: "40"}
        id: "5"
