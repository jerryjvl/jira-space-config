statuses:
  - name: Closed
    mode: reuse
    category: done
    description: The work item is considered finished, the resolution is correct. work items which are closed can be reopened.
    id: "6"
  - name: Done
    mode: reuse
    category: done
    id: "10010"
  - name: In Progress
    mode: reuse
    category: in_progress
    description: This work item is being actively worked on at the moment by the assignee.
    id: "3"
  - name: Open
    mode: reuse
    category: todo
    description: The work item is open and ready for the assignee to start work on it.
    id: "1"
  - name: Reopened
    mode: reuse
    category: todo
    description: This work item was once resolved, but the resolution was deemed incorrect. From here the work items are either reopened, or are closed.
    id: "4"
  - name: Resolved
    mode: reuse
    category: done
    description: A resolution has been taken, and it's awaiting verification by the reporter. From here work items are either reopened, or are closed.
    id: "5"
  - name: To Do
    mode: reuse
    category: todo
    id: "10011"

resolutions:
  - name: Cannot Reproduce
    mode: reuse
    description: All attempts at reproducing this work item failed, or not enough information was available to reproduce the work item. Reading the code produces no clues as to why this behaviour would occur. If more information appears later, please reopen the work item.
    id: "10003"
  - name: Done
    mode: reuse
    description: Work has been completed on this issue.
    id: "10000"
  - name: Duplicate
    mode: reuse
    description: The problem is a duplicate of an existing work item.
    id: "10002"
  - name: Won't Do
    mode: reuse
    description: This issue won't be actioned.
    id: "10001"

