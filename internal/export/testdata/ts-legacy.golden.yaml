workflows:
  - name: Software Simplified Workflow for Project TS
    mode: reuse
    description: Generated by JIRA Software version 1001.0.0-SNAPSHOT. This workflow is managed internally by Jira. Do not manually modify this workflow.
    id: ed643179-7c7c-444a-beaf-a807bd648e02
    statuses: [Backlog, Selected for development, In Progress, Done]
    transitions:
      - name: Backlog
        type: global
        to: Backlog
        post_functions:
          - type: clear_field
            field: Resolution
        id: "11"
      - name: Selected for development
        type: global
        to: Selected for development
        post_functions:
          - type: clear_field
            field: Resolution
        id: "21"
      - name: In Progress
        type: global
        to: In Progress
        post_functions:
          - type: clear_field
            field: Resolution
        id: "31"
      - name: Done
        type: global
        to: Done
        post_functions:
          - type: clear_field
            field: Resolution
        id: "41"
      - name: Create
        type: initial
        to: Backlog
        validators:
          - type: permission
            permission: CREATE_ISSUES
        properties: {jira.i18n.title: common.forms.create}
        id: "1"

