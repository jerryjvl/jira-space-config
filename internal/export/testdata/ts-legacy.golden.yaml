notes:
  - The space uses Jira's system default field configuration scheme (no scheme of its own).
  - Field "development" is shown as "Development" in this account's language; the spec uses the stored name.
  - Field "Issue color" is shown as "Issue colour" in this account's language; the spec uses the stored name.
  - Field "AgentSessions" is shown as "Agent Sessions" in this account's language; the spec uses the stored name.
  - Field dataclassification is configured for the space but is not in the site's field list; the spec names it as id:dataclassification.
  - Field customfield_10036 is configured for the space but is not in the site's field list; the spec names it as id:customfield_10036.
  - Field customfield_10037 is configured for the space but is not in the site's field list; the spec names it as id:customfield_10037.
  - Field "Start date" has a default value of type "datepicker", which the format has no form for; set it in Jira by hand.
  - Field "Actual start" has a default value of type "datetimepicker", which the format has no form for; set it in Jira by hand.
  - Field "Actual end" has a default value of type "datetimepicker", which the format has no form for; set it in Jira by hand.
  - Workflow "Software Simplified Workflow for Project TS" is a simplified workflow that Jira manages through the board's columns; change it there, not here.
  - Role type "atlassian-addons-project-access" (id 10012) has the same name as role 10003 used here; the ID in the spec tells them apart.
  - Role type "jira-guest-member" (id 10011) has the same name as role 10014 used here; the ID in the spec tells them apart.
