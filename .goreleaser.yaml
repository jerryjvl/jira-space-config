# Release build: pushing a tag vX.Y.Z runs .github/workflows/release.yml,
# which runs GoReleaser with this file (the version is pinned in .mise.toml).
# Check it locally with: mise run release-check
version: 2

project_name: jira-space-config

builds:
  - id: jira-space-config
    main: ./cmd/jira-space-config
    binary: jira-space-config
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/jerryjvl/jira-space-config/internal/cli.version={{ .Version }}
    # Built files carry the commit's time, so a rebuild of a tag is identical.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: jira-space-config
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - docs/cmdline.md
      - docs/spec-format.md
      - docs/automation.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: git
  sort: asc

release:
  # A tag with a suffix (v1.0.0-rc.1) is published as a pre-release.
  prerelease: auto
